<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four Game</title>

    <!-- connect the js and css files -->
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/app.js"></script>
</head>

<body>

    <!-- Home Page  -->
    <main class="homePage">
        <h1> Connect Four </h1>

        <p class="description">
            Two Player Strategy Game 
        </p>

        <!-- Gamr image -->
         <div class="game-img">
            <img src="./assets/connect-four.png" alt= "Connect Four Game">
         </div>

        <!-- players names  -->
        <section class="players">
            <div class="playerBox">
            <span class="player-one">Player 1</span>
            </div>
            <div class="playerBox">
                  <span class="player-two">Player 2</span> 
            </div>
        </section>

        <!-- Buttons -->
        <div class="home-buttons">
            <button id="start">Start</button>
            <button id="open-instructions">How to play</button>
        </div>

        <!-- Instruction Button -->
        <dialog id="instructions">

            <h2> How to play </h2>
            <p> Two players take turns dropping discs into the grid. </p>
            <p> The first player to connect four discs horizontally, vertically, or diagonally wins!</p>
            <p> If the grid is full and no one wins, it's a draw. </p>

            <button id="close-instructions"> X </button>

        </dialog>
    </main>

    <!-- Game Page -->
     <section id= "gamePage" hidden>
        <h1>Connect Four Game</h1>
        <p id="turn">Player 1 turn</p>

        <div id="board"></div>
     </section>

    <button id="back" hidden> Back To Home</button>
    
</body>

</html>
